<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Voice Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent-dim: #8aaa22;
      --text: #f0f0f0;
      --text-dim: #888;
      --red: #ff4444;
      --orange: #ffaa00;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 2rem;
      letter-spacing: -1px;
      margin: 30px 0 6px;
      color: var(--accent);
    }
    .subtitle {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 30px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 16px;
    }
    .card label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
    }
    .key-row { display: flex; gap: 10px; }
    #apiKeyInput {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #apiKeyInput:focus { border-color: var(--accent); }
    #saveKeyBtn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    #saveKeyBtn:hover { background: var(--accent-dim); }
    .key-status { font-size: 0.7rem; margin-top: 8px; color: var(--text-dim); }
    .key-status.ok { color: var(--accent); }
    .key-status.err { color: var(--red); }
    #status {
      background: var(--bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: border-color 0.3s, background 0.3s;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #status.listening { border-color: var(--red) !important; animation: pulse 1.5s infinite; }
    #status.processing { border-color: var(--orange) !important; }
    #status.ready { border-color: var(--accent) !important; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .btn-row { display: flex; gap: 12px; }
    button.main-btn {
      flex: 1;
      padding: 16px;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    button.main-btn:active { transform: scale(0.97); }
    button.main-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #startBtn { background: var(--accent); color: #000; }
    #stopBtn { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .box-label {
      font-size: 0.65rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    #transcript, #response {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      min-height: 80px;
      white-space: pre-wrap;
      font-size: 0.85rem;
      line-height: 1.6;
      color: var(--text);
    }
    #response { color: var(--accent); }
    .instructions {
      font-size: 0.72rem;
      color: var(--text-dim);
      line-height: 1.8;
      text-align: center;
    }
    .instructions span { color: var(--accent); font-weight: 700; }
    .footer {
      margin-top: 30px;
      font-size: 0.65rem;
      color: #333;
      text-align: center;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>Claude Voice</h1>
  <p class="subtitle">Speak freely &mdash; Welsh or English</p>

  <div class="card">
    <label>🔑 Your Anthropic API Key</label>
    <div class="key-row">
      <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false">
      <button id="saveKeyBtn" onclick="saveKey()">Save</button>
    </div>
    <div class="key-status" id="keyStatus">No key saved — enter your key above to get started.</div>
  </div>

  <div class="card">
    <label>Status</label>
    <div id="status">Enter your API key above to begin.</div>
  </div>

  <div class="card">
    <div class="btn-row">
      <button class="main-btn" id="startBtn" onclick="startListening()" disabled>🎤 Start Li
